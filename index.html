<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineFlick - Your Movie Hub</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:white;font-family:Arial}
header{display:flex;justify-content:space-between;padding:15px;background:#1e293b}
.logo{font-size:24px;font-weight:bold}
.logo span{color:#3b82f6}
.beta{opacity:0.7}
.hero{background:linear-gradient(135deg,#4338ca,#a21caf);padding:40px 20px;text-align:center}
.hero h1{font-size:28px}
.hero p{opacity:0.8;margin-top:5px}
.filters{display:flex;gap:10px;padding:15px;overflow-x:auto;background:#0f172a;border-bottom:1px solid #334155}
.filters button{padding:8px 18px;border-radius:20px;border:none;background:#1e293b;color:white;cursor:pointer;white-space:nowrap}
.filters button.active{background:#3b82f6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#1e293b;border-radius:12px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:180px;object-fit:cover}
.card-info{padding:10px}
.card-info h3{font-size:14px}
.card-info p{font-size:11px;opacity:0.6;text-transform:lowercase}
#modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:100;justify-content:center;align-items:center;padding:20px}
#modal.active{display:flex}
.modal-box{background:#1e293b;width:100%;max-width:500px;border-radius:12px;overflow:hidden}
.modal-box img{width:100%;height:250px;object-fit:cover}
.modal-content{padding:15px}
.close{float:right;font-size:24px;cursor:pointer}
.play-btn{width:100%;padding:12px;background:#3b82f6;border:none;color:white;border-radius:8px;margin-top:10px;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<header><div class="logo">Cine<span>Flick</span></div><div class="beta">BETA</div></header>
<div class="hero"><h1>Anime | Hollywood | K-Drama</h1><p>Your Movie Hub</p></div>
<div class="filters">
<button class="active" onclick="filterMovies('all',this)">All</button>
<button onclick="filterMovies('anime',this)">Anime</button>
<button onclick="filterMovies('hollywood',this)">Hollywood</button>
<button onclick="filterMovies('kdrama',this)">K-Drama</button>
</div>
<div class="grid" id="movieGrid"></div>

<div id="modal" onclick="if(event.target==this)closeModal()">
<div class="modal-box">
<span class="close" onclick="closeModal()">&times;</span>
<img id="modalImg" src="">
<div class="modal-content">
<h2 id="modalTitle"></h2>
<p id="modalCat" style="opacity:0.6;font-size:12px;margin:5px 0"></p>
<p style="font-size:13px;margin-top:10px">🔥 Trending now on CineFlick. Click play to watch !</p>
<button class="play-btn" onclick="playVideo()">▶️ Play Now</button>
<div id="videoArea" style="margin-top:15px;display:none">
<iframe id="yt" width="100%" height="200" frameborder="0" allowfullscreen></iframe>
</div>
</div>
</div>
</div>

<script>
const movies=[
{name:"Demon Slayer",cat:"anime",img:"https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=400",yt:"https://www.youtube.com/embed/8t8cFz9o6yM"} 3YbZ-3k4I"},
{name:"Deadpool",cat:"hollywood",img:"https://images.unsplash.com/photo-1635805733572-1f3c9b4747a7?w=400",yt:"https://www.youtube.com/embed/ONHBaC-pfsk"},
{name:"Squid Game",cat:"kdrama",img:"https://images.unsplash.com/photo-1485846234645-a62644f84728?w=400",yt:"https://www.youtube.com/embed/oqxAJKy0ii4"},
{name:"Attack on Titan",cat:"anime",img:"https://images.unsplash.com/photo",yt:"https://www.youtube.com/embed/MGRm4IzK1SQ"},
{name:"Avengers",cat:"hollywood",img:"https://function playVideo(){
document.getElementById('videoArea').style.display='block';
document.getElementById('videoSource').src=currentYT;
document.getElementById('myVideo').load();
document.getElementById('myVideo').play();div id="videoArea" style="margin-top:15px;display:none">
<video id="myVideo" width="100%" height="250" controls controlsList="nodownload" style="border-radius:8px;background:black">
<source id="videoSource" src="" type="video/mp4">
</video>
</div>
}
];
let currentYT="";
function render(list){
document.getElementById('movieGrid').innerHTML=list.map(m=>`
<div class="card" onclick="openModal('${m.name}','${m.cat}','${m.img}','${m.yt}')">
<img src="${m.img}"><div class="card-info"><h3>${m.name}</h3><p>${m.cat}</p></div>
</div>`).join('');
}
function filterMovies(cat,btn){
document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
if(cat=='all')render(movies);else render(movies.filter(m=>m.cat==cat));
}
function openModal(name,cat,img,yt){
document.getElementById('modalTitle').innerText=name;
document.getElementById('modalCat').innerText=cat;
document.getElementById('modalImg').src=img;
currentYT=yt;
document.getElementById('videoArea').style.display='none';
document.getElementById('modal').classList.add('active');
}
function closeModal(){
document.getElementById('modal').classList.remove('active');
document.getElementById('yt').src='';
}
function playVideo(){
document.getElementById('videoArea').style.display='block';
document.getElementById('yt').src=currentYT+'?autoplay=1';
}
render(movies);
</script>
</body>
</html>
