<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CineFlick</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0a0a0a;color:#fff;padding-bottom:80px}
.top{padding:10px;display:flex;gap:8px;align-items:center;background:#111;position:sticky;top:0;z-index:10}
.search{flex:1;background:#222;border-radius:20px;padding:9px 14px;display:flex;gap:6px}
.search input{flex:1;background:transparent;border:0;outline:0;color:#fff}
.search b{color:#00ff88}
.cat{display:flex;gap:8px;overflow:auto;padding:8px 12px}
.cat div{padding:6px 14px;background:#222;border-radius:20px;font-size:13px;white-space:nowrap}
.cat div.active{background:#ff1a1a}
.hero{margin:10px 12px;height:185px;border-radius:14px;background:linear-gradient(to top,#000,transparent),url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23');background-size:cover;display:flex;align-items:flex-end;padding:12px}
.hlist{display:flex;gap:10px;overflow:auto;padding:10px}
.hcard{min-width:260px;background:#1a1a1a;border-radius:10px;padding:8px;display:flex;gap:10px;align-items:center}
.hcard img{width:50px;height:70px;border-radius:8px;object-fit:cover}
.prem{margin:12px;background:linear-gradient(90deg,#c8a86a,#f5e7a6);color:#000;padding:12px;border-radius:10px;display:flex;justify-content:space-between}
.prem button{background:#fff;border:0;padding:6px 12px;border-radius:20px}
.grid{display:flex;gap:10px;overflow:auto;padding:10px}
.m{min-width:120px;position:relative}
.m img{width:120px;height:170px;border-radius:10px;object-fit:cover}
.m i{position:absolute;top:6px;left:6px;background:#f5d67a;color:#000;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;font-style:normal}
.m p{font-size:11px;width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#151515;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #222}
.bottom div{font-size:11px;color:#777;text-align:center}
.bottom div.on{color:#00ff88}
.page{display:none}.page.show{display:block}
</style></head><body>
<div class="top"><div class="search">🔍<input id="q" value="Bleach" placeholder="Search"><b onclick="search()">Search</b></div></div>
<div id="p1" class="page show">
<div class="cat"><div class="active">🔴 LIVE</div><div>Football</div><div>Trending</div><div>Cricket</div><div>MangoTV</div></div>
<div class="hero"><div><b>Dhamaal 4 [Hindi] • 2026</b><br><small>Action • Comedy</small></div></div>
<div class="hlist" id="hlist"></div>
>No ads • HD •  small></div> Play ▶️ with watch/button></div>
<div style="padding:10px"><b>Trending Movies</b></div>
<div class="grid" id="g1"></div>
<div style="padding:10px"><b>Trending TV Series</b></div>
<div class="grid" id="g2"></div>
</div>
<div id="p2" class="page"><div style="padding:12px"><h3>Search Result</h3><div class="grid" id="g3" style="flex-wrap:wrap"></div></div></div>
<div id="p3" class="page"><div style="padding:20px"><h3>Me / Settings</h3><p style="background:#222;padding:14px;border-radius:10px;margin-top:10px" id="u">Guest <span onclick="let n=prompt('Name?');if(n){localStorage.setItem('u',n);location.reload()}" style="color:#0f0">Login</span></p><p style="background:#222;padding:14px;border-radius:10px;margin-top:10px" onclick="localStorage.clear();location.reload()">Clear Data</p></div></div>
<div class="bottom">
<div class="on" onclick="show(1,this)">🏠<br>Home</div>
<div onclick="show(2,this)">🔍<br>Search</div>
<div onclick="show(3,this)">👤<br>Me</div>
</div>
<script>
let movies=[
{name:"Hollywood [Hindi]",img:"https://images.unsplash.com/photo-1536440136628-849c177e76a1"},
{name:"Anime,img:"https://images.unsplash.com/photo-1485846234645-a62644f84728"},
{name:"Series Tv show img:"https://images.unsplash.com/photo-1608346128025-1896b97a6fa7"},
{name:"Bollywood",img:"https://images.unsplash.com/photo-1509347528160-9a9e33742cdb"},
{name:"Animal",img:"https://images.unsplash.com/photo-1462331940025-496dfbfc7564"},
{name:"Korean Kanakaraj",img:"https://images.unsplash.com/photo-1509347528160-9a9e33742cdb"}
];
function render(list,id){document.getElementById(id).innerHTML=list.map((m,i)=>`<div class="m"><i>${i+1}</i><img src="${m.img}"><p>${m.name}</p></div>`).join('')}
function show(n,el){document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));document.getElementById('p'+n).classList.add('show');document.querySelectorAll('.bottom div').forEach(d=>d.classList.remove('on'));el.classList.add('on')}
function search(){let q=document.getElementById('q').value.toLowerCase();let f=movies.filter(m=>m.name.toLowerCase().includes(q));render(f,'g1');render(f,'g3');show(2,document.querySelectorAll('.bottom div')[1])}
render(movies,'g1');render(movies,'g2');render(movies,'g3');
document.getElementById('hlist').innerHTML=movies.map(m=>`<div class="hcard"><img src="${m.img}"><div><b style="font-size:13px">${m.name}</b><br><small>2026</small></div></div>`).join('');
</script></body></html>
