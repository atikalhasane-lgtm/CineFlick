*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0a0a0a;color:#fff;padding-bottom:80px}
.top{padding:10px 12px;display:flex;gap:8px;align-items:center;position:sticky;top:0;background:#0a0a0a;z-index:10}
.search{flex:1;background:#1e1e1e;border-radius:25px;padding:10px 15px;display:flex;gap:8px;align-items:center}

.page{display:none}.page.show{display:block}
.tabs{display:flex;gap:8px;overflow:auto;padding:8px 12px}

.tabs div.on{background:#f2d27a;color:#000}
.banner{margin:12px;border-radius:16px;height:190px;background:linear-gradient(to top,#000,transparent),url('https://images.unsplash.com/photo-1536440136628-849c177e76a1');background-size:cover;display:flex;align-items:flex-end;padding:12px}
.gold{margin:12px;background:linear-gradient(90deg,#c9a86a,#f9e7a0);border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;color:#000}
.row{display:flex;gap:10px;overflow:auto;padding:12px}
.card{min-width:130px;background:#161616;border-radius:10px;overflow:hidden;position:relative}
.card img{width:130px;height:175px;object-fit:cover}
.badge{position:absolute;top:6px;left:6px;background:#f2d27a;color:#000;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.card p{padding:6px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
