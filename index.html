          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CineFlick FREE</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ff88">
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#0c0c0c;color:#fff;padding-bottom:70px}
.top{padding:12px;display:flex;gap:10px;background:#111;position:sticky;top:0}.top input{flex:1;background:#222;border:0;padding:10px 14px;border-radius:20px;color:#fff}
.card img{width:110px;height:150px;border-radius:10px;object-fit:cover}.row{display:flex;gap:10px;overflow:auto;padding:10px}.row::-webkit-scrollbar{display:none}
.page{display:none}.page.show{display:block}
.tab{position:fixed;bottom:0;left:0;right:0;background:#141414;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #222}
.tab div{color:#666;font-size:11px}.tab div.on{color:#00ff88}
</style></head><body>
<div id="h" class="page show"><div class="top">🔍<input placeholder="Search..."><span>FREE</span></div><div style="padding:12px"><b>🔥 FREE Movies - No Premium</b></div><div class="row" id="r1"></div></div>
<div id="d" class="page"><div style="padding:14px"><b>Downloads</b><div id="dl" style="margin-top:14px;color:#666">No downloads yet</div></div></div>
<div class="tab"><div class="on" onclick="go('h',this)">🏠<br>Home</div><div onclick="go('d',this)">⬇️<br>Down</div></div>
<script>
let m=[{n:"Pushpa 2",i:"https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=300"},{n:"Alpha",i:"https://images.unsplash.com/photo-1485846234645-a62644f84728?w=300"},{n:"Bleach",i:"https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=300"}];
r1.innerHTML=m.map(x=>`<div><img src="${x.i}"><p style="font-size:11px">${x.n}</p><small style="color:#00ff88">FREE</small></div>`).join('');
function go(id,e){document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));document.getElementById(id).classList.add('show');document.querySelectorAll('.tab div').forEach(d=>d.classList.remove('on'));e.classList.add('on')}
</script></body></html>
