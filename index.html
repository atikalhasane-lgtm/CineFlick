<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CineFlick</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0a0f1e;color:#fff}header{padding:15px;background:#111a30;display:flex;justify-content:space-between}.logo{font-weight:bold;font-size:22px}.logo span{color:#3b82f6}.hero{padding:30px;text-align:center;background:linear-gradient(135deg,#1e3a8a,#7c3aed)}.tabs{display:flex;gap:8px;padding:15px;overflow:auto}.tab{padding:8px 14px;background:#1f2937;border-radius:20px;white-space:nowrap}.tab.active{background:#3b82f6}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:15px}.card{background:#111a30;border-radius:10px;overflow:hidden}.card img{width:100%;height:190px;object-fit:cover}.card div{padding:8px;font-size:13px}</style></head><body><header><div class="logo">Cine<span>Flick</span></div><div>BETA</div></header><div class="hero"><h2>Anime | Hollywood | K-Drama</h2><p>Your Movie Hub</p></div><div class="tabs"><div class="tab active" onclick="f('all',this)">All</div><div class="tab" onclick="f('anime',this)">Anime</div><div class="tab" onclick="f('hollywood',this)">Hollywood</div><div class="tab" onclick="f('kdrama',this)">K-Drama</div></div><div class="grid" id="g"></div><script>const m=[{n:"Demon Slayer",c:"anime",i:"https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=300"},{n:"Solo Leveling",c:"anime",i:"https://images.unsplash.com/photo-1612036782180-6f0b6cd846fe?w=300"},{n:"Deadpool",c:"hollywood",i:"https://images.unsplash.com/photo-1635805737707-575885ab0820?w=300"},{n:"Squid Game",c:"kdrama",i:"https://images.unsplash.com/photo-1594909122845-11baa439b7bf?w=300"}];function r(l){document.getElementById('g').innerHTML=l.map(x=>`<div class=card><img src=${x.i}><div>${x.n}<br><small style=color:#888>${x.c}</small></div></div>`).join('')}function f(c,e){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));e.classList.add('active');if(c=='all')r(m);else r(m.filter(x=>x.c==c))}r(m)</script></body></html>
